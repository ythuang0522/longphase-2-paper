<text x="40" y="305" class="s" text-anchor="start">• up to 20 variants on each side (≤ 41 variants, ≤ 82 allele nodes; windows above 256 nodes are skipped)</text>
<text x="40" y="321" class="s" text-anchor="start">• nodes: one per allele; SNV, indel, SV and 5mC records are merged and sorted by position</text>
<text x="40" y="337" class="s" text-anchor="start">• edges: DOT edges with both endpoints in the window, symmetrized, plus one self-loop per node (mean of incident edge features)</text>
<text x="40" y="353" class="s" text-anchor="start">• predictions of the two allele nodes are averaged; a variant covered by several windows receives the mean</text>
<text x="20" y="400" class="pl" text-anchor="start">b</text>
<text x="42" y="400" class="h" text-anchor="start">Bridge vertex feature</text>
