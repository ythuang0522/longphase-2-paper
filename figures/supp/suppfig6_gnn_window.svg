<text x="240" y="500" class="s" text-anchor="middle" fill="#E0A030">removing this variant disconnects the window → is_bridge = 1</text>
<text x="600" y="400" class="pl" text-anchor="start">c</text>
<text x="622" y="400" class="h" text-anchor="start">Center-zone mask</text>
<text x="620" y="440" class="s" text-anchor="start">r = |pos − pos_c| / max offset in window</text>
<text x="620" y="458" class="s" text-anchor="start">kept if r ≤ min(1, 10 / round(20·r_max))</text>
<text x="620" y="476" class="s" text-anchor="start">so that predictions are read only where both</text>
<text x="620" y="492" class="s" text-anchor="start">sides of the variant are visible to the network.</text>
</svg>