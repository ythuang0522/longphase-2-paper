<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>Read-based correction</title>

<style>
 text{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#16233D}
 .pl{font-size:22px;font-weight:700}
 .h{font-size:15px;font-weight:600}
 .t{font-size:13px}
 .tb{font-size:13px;font-weight:600}
 .s{font-size:11px;fill:#6F8090}
 .sb{font-size:11px;font-weight:600}
 .m{font-size:13px;font-style:italic}
 .code{font-family:Menlo,Consolas,"Courier New",monospace;font-size:11.5px}
 .w{fill:#ffffff}
</style>

<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F8090"/></marker><marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16233D"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="20" y="34" class="pl" text-anchor="start">a</text>
<text x="42" y="34" class="h" text-anchor="start">Step 1: assign each read to a haplotype from the initial phase</text>
<text x="120" y="80" class="m" text-anchor="middle">v1</text>
<text x="200" y="80" class="m" text-anchor="middle">v2</text>
<text x="280" y="80" class="m" text-anchor="middle">v3</text>
<text x="360" y="80" class="m" text-anchor="middle">v4</text>
<text x="440" y="80" class="m" text-anchor="middle">v5</text>
<text x="520" y="80" class="m" text-anchor="middle">v6</text>
<line x1="90" y1="110" x2="560" y2="110" stroke="#1687C9" stroke-width="6" stroke-linecap="round"/>
<circle cx="120" cy="110" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="120" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="200" cy="110" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="200" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="280" cy="110" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="280" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="360" cy="110" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="360" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="520" cy="110" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="520" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<text x="580" y="114" class="s" text-anchor="start" fill="#1687C9">hap 1  (5/5)</text>
<line x1="90" y1="140" x2="560" y2="140" stroke="#F0766C" stroke-width="6" stroke-linecap="round"/>
<circle cx="120" cy="140" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="120" y="144" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="200" cy="140" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="200" y="144" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="360" cy="140" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="360" y="144" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="440" cy="140" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="440" y="144" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="520" cy="140" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="520" y="144" class="s" text-anchor="middle" fill="#fff">a</text>
<text x="580" y="144" class="s" text-anchor="start" fill="#DC2B23">hap 2  (5/5)</text>
<line x1="90" y1="170" x2="560" y2="170" stroke="#1687C9" stroke-width="6" stroke-linecap="round"/>
<circle cx="120" cy="170" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="120" y="174" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="200" cy="170" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="200" y="174" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="280" cy="170" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="280" y="174" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="360" cy="170" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="360" y="174" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="440" cy="170" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="440" y="174" class="s" text-anchor="middle" fill="#fff">r</text>
<text x="580" y="174" class="s" text-anchor="start" fill="#1687C9">hap 1  (4/5 = 0.80)</text>
<line x1="90" y1="200" x2="560" y2="200" stroke="#CBD5DE" stroke-width="6" stroke-linecap="round"/>
<circle cx="120" cy="200" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="120" y="204" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="200" cy="200" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="200" y="204" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="280" cy="200" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="280" y="204" class="s" text-anchor="middle" fill="#fff">a</text>
<circle cx="360" cy="200" r="8" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="360" y="204" class="s" text-anchor="middle" fill="#fff">r</text>
<text x="580" y="204" class="s" text-anchor="start" fill="#6F8090">untagged (2/4 = 0.50)</text>
<line x1="90" y1="230" x2="560" y2="230" stroke="#CBD5DE" stroke-width="6" stroke-linecap="round"/>
<circle cx="280" cy="230" r="8" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="280" y="234" class="s" text-anchor="middle" fill="#fff">a</text>
<text x="580" y="234" class="s" text-anchor="start" fill="#6F8090">untagged (&lt; 2 alleles)</text>
<text x="40" y="260" class="s" text-anchor="start">A read is tagged when max(n₁,n₂)/(n₁+n₂) &gt; 0.65 and it carries ≥ 2 informative alleles;</text>
<text x="40" y="276" class="s" text-anchor="start">SNV and SV alleles count 1, indels 0.1, 5mC 0.</text>
<text x="20" y="320" class="pl" text-anchor="start">b</text>
<text x="42" y="320" class="h" text-anchor="start">Step 2: re-derive each variant's phase from tagged reads</text>
<text x="40" y="360" class="tb" text-anchor="start">For variant v₃:</text>
<text x="40" y="382" class="s" text-anchor="start">hap-1 reads with REF + hap-2 reads with ALT  = n₁ = 1</text>
<text x="40" y="398" class="s" text-anchor="start">hap-1 reads with ALT + hap-2 reads with REF  = n₂ = 2</text>
<text x="40" y="420" class="tb" text-anchor="start" fill="#E0A030">confidence ρ = max(n₁,n₂)/(n₁+n₂) = 0.67  ≤ 0.75</text>
<text x="40" y="440" class="s" text-anchor="start" fill="#E0A030">→ v₃ left unphased (GT 0/1, no PS)</text>
<text x="560" y="360" class="tb" text-anchor="start">For variant v₁:</text>
<text x="560" y="382" class="s" text-anchor="start">n₁ = 3,  n₂ = 0,  ρ = 1.00 &gt; 0.75</text>
<text x="560" y="402" class="s" text-anchor="start" fill="#2E8B57">→ phase confirmed: REF on hap 1, ALT on hap 2 (GT 0|1)</text>
<text x="560" y="430" class="s" text-anchor="start">Only variants supported by the two read populations keep a</text>
<text x="560" y="446" class="s" text-anchor="start">phase; assignments driven by a few chimeric or mis-mapped</text>
<text x="560" y="462" class="s" text-anchor="start">reads are removed. Thresholds: --readConfidence 0.65,</text>
<text x="560" y="478" class="s" text-anchor="start">--snpConfidence 0.75.</text>
</svg>