<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390">
<title>Pairwise allele support and vote weighting</title>

<style>
 text{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#16233D}
 .pl{font-size:14px;font-weight:700}
 .h{font-size:11px;font-weight:600}
 .t{font-size:10px}
 .tb{font-size:10px;font-weight:600}
 .s{font-size:9px;fill:#6E7C8C}
 .sb{font-size:9px;font-weight:600}
 .n{font-size:8.5px;font-weight:700}
 .m{font-size:10px;font-style:italic}
 .mb{font-size:10px;font-style:italic;font-weight:600}
 .eq{font-size:10.5px}
 .code{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:9px}
</style>

<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7C8C"/></marker><marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16233D"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker></defs>
<rect width="780" height="390" fill="#ffffff"/>
<line x1="382.0" y1="18.0" x2="382.0" y2="374.0" stroke="#C7D1DB" stroke-width="0.8" stroke-linecap="round"/>
<text x="16.0" y="24.0" class="pl" text-anchor="start">a</text>
<text x="30.0" y="24.0" class="h" text-anchor="start">Allele-pair weights between two variants</text>
<text x="120.0" y="60.0" class="mb" text-anchor="middle" fill="#16233D">variant u</text>
<text x="280.0" y="60.0" class="mb" text-anchor="middle" fill="#16233D">variant v</text>
<line x1="131.0" y1="84.0" x2="269.0" y2="84.0" stroke="#1266B0" stroke-width="4.5" stroke-linecap="round"/>
<line x1="131.0" y1="152.0" x2="269.0" y2="152.0" stroke="#CE4125" stroke-width="3.8" stroke-linecap="round"/>
<line x1="130.0" y1="92.0" x2="270.0" y2="144.0" stroke="#C7D1DB" stroke-width="1.6" stroke-linecap="round"/>
<line x1="130.0" y1="144.0" x2="270.0" y2="92.0" stroke="#C7D1DB" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="120.0" cy="84.0" r="11" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<text x="120.0" y="87.0" class="n" text-anchor="middle" fill="#fff">r</text>
<circle cx="120.0" cy="152.0" r="11" fill="#CE4125" stroke="#CE4125" stroke-width="0"/>
<text x="120.0" y="155.0" class="n" text-anchor="middle" fill="#fff">a</text>
<circle cx="280.0" cy="84.0" r="11" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<text x="280.0" y="87.0" class="n" text-anchor="middle" fill="#fff">r</text>
<circle cx="280.0" cy="152.0" r="11" fill="#CE4125" stroke="#CE4125" stroke-width="0"/>
<text x="280.0" y="155.0" class="n" text-anchor="middle" fill="#fff">a</text>
<text x="104.0" y="87.0" class="m" text-anchor="end">u<tspan font-size="72%" baseline-shift="super">r</tspan></text>
<text x="104.0" y="155.0" class="m" text-anchor="end">u<tspan font-size="72%" baseline-shift="super">a</tspan></text>
<text x="296.0" y="87.0" class="m" text-anchor="start">v<tspan font-size="72%" baseline-shift="super">r</tspan></text>
<text x="296.0" y="155.0" class="m" text-anchor="start">v<tspan font-size="72%" baseline-shift="super">a</tspan></text>
<text x="200.0" y="76.0" class="tb" text-anchor="middle" fill="#1266B0">w<tspan font-size="72%" baseline-shift="sub">rr</tspan> = 9</text>
<text x="200.0" y="170.0" class="tb" text-anchor="middle" fill="#CE4125">w<tspan font-size="72%" baseline-shift="sub">aa</tspan> = 7</text>
<text x="200.0" y="186.0" class="sb" text-anchor="middle" fill="#6E7C8C">grey, trans pairs:   w<tspan font-size="72%" baseline-shift="sub">ra</tspan> = 1,   w<tspan font-size="72%" baseline-shift="sub">ar</tspan> = 0.1</text>
<rect x="16.0" y="196.0" width="350.0" height="68.0" rx="2" fill="#F1F4F7" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="28.0" y="215.0" class="eq" text-anchor="start" fill="#16233D">P = w<tspan font-size="72%" baseline-shift="sub">rr</tspan> + w<tspan font-size="72%" baseline-shift="sub">aa</tspan> = 16</text>
<text x="176.0" y="215.0" class="m" text-anchor="start" fill="#1266B0">cis</text>
<text x="28.0" y="235.0" class="eq" text-anchor="start" fill="#16233D">Q = w<tspan font-size="72%" baseline-shift="sub">ra</tspan> + w<tspan font-size="72%" baseline-shift="sub">ar</tspan> = 1.1</text>
<text x="176.0" y="235.0" class="m" text-anchor="start" fill="#CE4125">trans</text>
<text x="28.0" y="255.0" class="eq" text-anchor="start" fill="#16233D">s = min(P,Q) / max(P,Q) = 0.07</text>
<text x="16.0" y="280.0" class="s" text-anchor="start">each read adds 1 (both bases ≥ Q12) or 0.1</text>
<text x="16.0" y="300.0" class="pl" text-anchor="start">d</text>
<text x="30.0" y="300.0" class="h" text-anchor="start">Exported graph (DOT)</text>
<rect x="16.0" y="312.0" width="350.0" height="54.0" rx="2" fill="#F1F4F7" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="26.0" y="329.0" class="code" text-anchor="start">1001.1 -&gt; 1543.1 [label=16.0]</text>
<text x="26.0" y="343.0" class="code" text-anchor="start">1001.2 -&gt; 1543.2 [label=1.1]</text>
<text x="26.0" y="359.0" class="s" text-anchor="start">position.allele → position.allele, label = vote weight</text>
<text x="400.0" y="24.0" class="pl" text-anchor="start">b</text>
<text x="414.0" y="24.0" class="h" text-anchor="start">Vote rules for the pair (u, v)</text>
<rect x="400.0" y="38.0" width="364.0" height="16.0" rx="0" fill="#E4EAF0" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="49.0" class="sb" text-anchor="start" fill="#16233D">condition on s</text>
<text x="584.0" y="49.0" class="sb" text-anchor="start" fill="#16233D">vote for v</text>
<rect x="400.0" y="54.0" width="364.0" height="16.0" rx="0" fill="#F1F4F7" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="65.0" class="tb" text-anchor="start" fill="#6E7C8C">s &gt; 0.7</text>
<text x="584.0" y="65.0" class="t" text-anchor="start" fill="#6E7C8C">no vote</text>
<rect x="400.0" y="70.0" width="364.0" height="16.0" rx="0" fill="#F1F4F7" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="81.0" class="tb" text-anchor="start" fill="#6E7C8C">s &gt; 0.3, SNV–5mC pair</text>
<text x="584.0" y="81.0" class="t" text-anchor="start" fill="#6E7C8C">no vote</text>
<rect x="400.0" y="86.0" width="364.0" height="16.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="97.0" class="tb" text-anchor="start" fill="#16233D">0.1 &lt; s ≤ 0.7</text>
<text x="584.0" y="97.0" class="t" text-anchor="start" fill="#16233D">vote larger of P, Q; weight 1</text>
<rect x="400.0" y="102.0" width="364.0" height="16.0" rx="0" fill="#E4F1EA" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="113.0" class="tb" text-anchor="start" fill="#1F7A4D">s ≤ 0.1 or one side unsupported</text>
<text x="584.0" y="113.0" class="t" text-anchor="start" fill="#1F7A4D">vote; weight 20</text>
<rect x="400.0" y="118.0" width="364.0" height="16.0" rx="0" fill="#FBF0D5" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="406.0" y="129.0" class="tb" text-anchor="start" fill="#B8860B">u is a tandem-repeat indel</text>
<text x="584.0" y="129.0" class="t" text-anchor="start" fill="#B8860B">vote; weight 0.1</text>
<rect x="400.0" y="38.0" width="364.0" height="96.0" rx="0" fill="none" stroke="#C7D1DB" stroke-width="0.8" opacity="1"/>
<line x1="400.0" y1="54.0" x2="764.0" y2="54.0" stroke="#C7D1DB" stroke-width="0.8" stroke-linecap="butt"/>
<text x="400.0" y="156.0" class="s" text-anchor="start">the vote names a haplotype for v given hap(u)</text>
<text x="400.0" y="176.0" class="sb" text-anchor="start" fill="#16233D">P → v<tspan font-size="72%" baseline-shift="super">r</tspan> on hap(u<tspan font-size="72%" baseline-shift="super">r</tspan>);   Q → v<tspan font-size="72%" baseline-shift="super">r</tspan> on hap(u<tspan font-size="72%" baseline-shift="super">a</tspan>)</text>
<text x="400.0" y="208.0" class="pl" text-anchor="start">c</text>
<text x="414.0" y="208.0" class="h" text-anchor="start">Single-read guard</text>
<rect x="458.0" y="226.0" width="21.0" height="94.0" rx="1" fill="#FBF0D5" stroke="none" stroke-width="0.8" opacity="1"/>
<line x1="458.0" y1="232.0" x2="466.4" y2="232.0" stroke="#B8860B" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="466.4" cy="232.0" r="2.6" fill="#B8860B" stroke="#B8860B" stroke-width="0"/>
<line x1="458.0" y1="243.0" x2="470.6" y2="243.0" stroke="#B8860B" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="470.6" cy="243.0" r="2.6" fill="#B8860B" stroke="#B8860B" stroke-width="0"/>
<line x1="458.0" y1="254.0" x2="474.8" y2="254.0" stroke="#B8860B" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="474.8" cy="254.0" r="2.6" fill="#B8860B" stroke="#B8860B" stroke-width="0"/>
<line x1="458.0" y1="265.0" x2="479.0" y2="265.0" stroke="#B8860B" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="479.0" cy="265.0" r="2.6" fill="#B8860B" stroke="#B8860B" stroke-width="0"/>
<line x1="458.0" y1="276.0" x2="512.6" y2="276.0" stroke="#1266B0" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="512.6" cy="276.0" r="2.6" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<line x1="458.0" y1="287.0" x2="544.1" y2="287.0" stroke="#1266B0" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="544.1" cy="287.0" r="2.6" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<line x1="458.0" y1="298.0" x2="584.0" y2="298.0" stroke="#1266B0" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="584.0" cy="298.0" r="2.6" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<line x1="458.0" y1="309.0" x2="655.4" y2="309.0" stroke="#1266B0" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="655.4" cy="309.0" r="2.6" fill="#1266B0" stroke="#1266B0" stroke-width="0"/>
<line x1="458.0" y1="320.0" x2="668.0" y2="320.0" stroke="#16233D" stroke-width="1" stroke-linecap="round"/>
<line x1="458.0" y1="320.0" x2="458.0" y2="324.0" stroke="#16233D" stroke-width="1" stroke-linecap="round"/>
<text x="458.0" y="334.0" class="s" text-anchor="middle">0</text>
<line x1="479.0" y1="320.0" x2="479.0" y2="324.0" stroke="#16233D" stroke-width="1" stroke-linecap="round"/>
<text x="479.0" y="334.0" class="s" text-anchor="middle">1</text>
<line x1="563.0" y1="320.0" x2="563.0" y2="324.0" stroke="#16233D" stroke-width="1" stroke-linecap="round"/>
<text x="563.0" y="334.0" class="s" text-anchor="middle">5</text>
<line x1="668.0" y1="320.0" x2="668.0" y2="324.0" stroke="#16233D" stroke-width="1" stroke-linecap="round"/>
<text x="668.0" y="334.0" class="s" text-anchor="middle">10</text>
<text x="452.0" y="279.0" class="s" text-anchor="end">votes to v</text>
<text x="676.0" y="324.0" class="s" text-anchor="start">P + Q</text>
<text x="483.0" y="222.0" class="sb" text-anchor="start" fill="#B8860B">4 votes rest on a single read (P + Q ≤ 1)</text>
<rect x="400.0" y="340.0" width="364.0" height="34.0" rx="2" fill="#FBF0D5" stroke="none" stroke-width="0.8" opacity="1"/>
<rect x="400.0" y="340.0" width="2.2" height="34.0" rx="0" fill="#B8860B" stroke="none" stroke-width="0.8" opacity="1"/>
<text x="412.0" y="356.0" class="tb" text-anchor="start" fill="#16233D">&gt; 3 such votes → recompute h<tspan font-size="72%" baseline-shift="sub">1</tspan>, h<tspan font-size="72%" baseline-shift="sub">2</tspan> from s &lt; 0.2, non-indel votes only</text>
</svg>