<text x="200" y="154" class="sb" text-anchor="end">query h₀</text>
<circle cx="230" cy="150" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="230" y="154" class="s" text-anchor="middle" fill="#fff">0</text>
