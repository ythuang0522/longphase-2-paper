<text x="860" y="154" class="s" text-anchor="middle" fill="#fff">0</text>
<text x="200" y="204" class="sb" text-anchor="end">switch encoding (query)</text>
<text x="265.0" y="204" class="tb" text-anchor="middle" fill="#6F8090">0</text>
<text x="335.0" y="204" class="tb" text-anchor="middle" fill="#6F8090">0</text>
<text x="405.0" y="204" class="tb" text-anchor="middle" fill="#DC2B23">1</text>
<line x1="405.0" y1="165" x2="405.0" y2="190" stroke="#DC2B23" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
<text x="475.0" y="204" class="tb" text-anchor="middle" fill="#6F8090">0</text>
<text x="545.0" y="204" class="tb" text-anchor="middle" fill="#6F8090">0</text>
<text x="615.0" y="204" class="tb" text-anchor="middle" fill="#6F8090">0</text>
<text x="685.0" y="204" class="tb" text-anchor="middle" fill="#DC2B23">1</text>
<line x1="685.0" y1="165" x2="685.0" y2="190" stroke="#DC2B23" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
<text x="755.0" y="204" class="tb" text-anchor="middle" fill="#DC2B23">1</text>
<line x1="755.0" y1="165" x2="755.0" y2="190" stroke="#DC2B23" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
<text x="825.0" y="204" class="tb" text-anchor="middle" fill="#DC2B23">1</text>
<line x1="825.0" y1="165" x2="825.0" y2="190" stroke="#DC2B23" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
<text x="100" y="240" class="t" text-anchor="start">switch errors = number of positions where the switch encodings differ = 4</text>
<text x="100" y="262" class="s" text-anchor="start">switch/flip decomposition: two adjacent switches (positions 7–8) form one flip; isolated switches = 2, flips = 1</text>
<text x="100" y="284" class="s" text-anchor="start">Hamming distance = min over the two orientations of misassigned variants = min(5, 5) = 5 of 10 (50%)</text>
<text x="100" y="306" class="s" text-anchor="start">(per-block minimum, summed over blocks, divided by variants compared)</text>
<text x="20" y="350" class="pl" text-anchor="start">b</text>
<text x="42" y="350" class="h" text-anchor="start">Block statistics</text>
<text x="40" y="384" class="s" text-anchor="start">Blocks are intersected: only variants heterozygous in both files and phased in both are compared; singleton blocks are ignored.</text>
<text x="40" y="402" class="s" text-anchor="start">Phased SNV (%) = truth heterozygous SNVs phased by the query / all truth heterozygous SNVs (same for indels, SVs, 5mC).</text>
<text x="40" y="420" class="s" text-anchor="start">Block N50 = span of the block at which the cumulative span of query blocks, sorted by length, reaches 50% of the total.</text>
<text x="40" y="438" class="s" text-anchor="start">Switch error rate (%) = switch errors / assessed variant pairs × 100. Cross-tool comparisons use SNVs only (--only-snvs).</text>
<text x="40" y="466" class="s" text-anchor="start">Implemented in longphase compare (re-implementation of whatshap compare; identical values, parallel over chromosomes).</text>
</svg>