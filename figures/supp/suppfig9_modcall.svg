<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<title>Allele-specific methylation calling (modcall)</title>

<style>
 text{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#16233D}
 .pl{font-size:22px;font-weight:700}
 .h{font-size:15px;font-weight:600}
 .t{font-size:13px}
 .tb{font-size:13px;font-weight:600}
 .s{font-size:11px;fill:#6F8090}
 .sb{font-size:11px;font-weight:600}
 .m{font-size:13px;font-style:italic}
 .code{font-family:Menlo,Consolas,"Courier New",monospace;font-size:11.5px}
 .w{fill:#ffffff}
</style>

<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F8090"/></marker><marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16233D"/></marker></defs>
<rect width="1100" height="600" fill="#ffffff"/>
<text x="20" y="34" class="pl" text-anchor="start">a</text>
<text x="42" y="34" class="h" text-anchor="start">Per-read CpG state from ML probability</text>
<line x1="60" y1="90" x2="460" y2="90" stroke="#16233D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="85" x2="60" y2="95" stroke="#16233D" stroke-width="1.5" stroke-linecap="round"/>
<text x="60" y="110" class="s" text-anchor="middle">0</text>
<line x1="140.0" y1="85" x2="140.0" y2="95" stroke="#16233D" stroke-width="1.5" stroke-linecap="round"/>
<text x="140.0" y="110" class="s" text-anchor="middle">0.2</text>
<line x1="380.0" y1="85" x2="380.0" y2="95" stroke="#16233D" stroke-width="1.5" stroke-linecap="round"/>
<text x="380.0" y="110" class="s" text-anchor="middle">0.8</text>
<line x1="460" y1="85" x2="460" y2="95" stroke="#16233D" stroke-width="1.5" stroke-linecap="round"/>
<text x="460" y="110" class="s" text-anchor="middle">1</text>
<rect x="60" y="60" width="80.0" height="22" rx="3" fill="#E3F1FA" stroke="none" stroke-width="1" opacity="1"/>
<text x="100.0" y="76" class="sb" text-anchor="middle" fill="#1687C9">unmethylated</text>
<rect x="140.0" y="60" width="240.0" height="22" rx="3" fill="#EEF2F5" stroke="none" stroke-width="1" opacity="1"/>
<text x="260.0" y="76" class="sb" text-anchor="middle" fill="#6F8090">noise (ignored)</text>
<rect x="380.0" y="60" width="80.0" height="22" rx="3" fill="#FBE7E6" stroke="none" stroke-width="1" opacity="1"/>
<text x="420.0" y="76" class="sb" text-anchor="middle" fill="#DC2B23">methylated</text>
<text x="60" y="134" class="s" text-anchor="start">ML tag / 255; thresholds --modThreshold 0.8, --unModThreshold 0.2</text>
<text x="20" y="170" class="pl" text-anchor="start">b</text>
<text x="42" y="170" class="h" text-anchor="start">CpG strand pairing and site genotype</text>
<text x="40" y="215" class="s" text-anchor="start">5′ … C G … 3′   forward-strand reads report C;  reverse-strand reads report the G position</text>
<text x="40" y="231" class="s" text-anchor="start">→ reverse-strand calls are mapped to the forward CpG coordinate and the two strands are pooled</text>
<text x="40" y="259" class="s" text-anchor="start">m = methylated reads, u = unmethylated reads, noise = depth − m − u</text>
<text x="40" y="285" class="tb" text-anchor="start">heterozygous (allele-specific) if  min(m,u)/max(m,u) ≥ 0.6  and  noise/depth ≤ 0.2</text>
<text x="40" y="305" class="s" text-anchor="start">otherwise homozygous methylated (m ≥ u) or unmethylated → excluded from phasing</text>
<rect x="40" y="330" width="130.0" height="16" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<rect x="170.0" y="330" width="111.42857142857143" height="16" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="281.42857142857144" y="330" width="18.571428571428573" height="16" rx="2" fill="#CBD5DE" stroke="none" stroke-width="1" opacity="1"/>
<text x="310" y="342" class="s" text-anchor="start">m=14, u=12, noise=2</text>
<text x="470" y="342" class="sb" text-anchor="start" fill="#2E8B57">0/1</text>
<rect x="40" y="356" width="232.14285714285714" height="16" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<rect x="272.1428571428571" y="356" width="18.571428571428573" height="16" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="290.7142857142857" y="356" width="9.285714285714286" height="16" rx="2" fill="#CBD5DE" stroke="none" stroke-width="1" opacity="1"/>
<text x="310" y="368" class="s" text-anchor="start">m=25, u=2, noise=1</text>
<text x="470" y="368" class="sb" text-anchor="start" fill="#6F8090">1/1</text>
<rect x="40" y="382" width="83.57142857142857" height="16" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<rect x="123.57142857142857" y="382" width="74.28571428571429" height="16" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="197.85714285714286" y="382" width="102.14285714285714" height="16" rx="2" fill="#CBD5DE" stroke="none" stroke-width="1" opacity="1"/>
<text x="310" y="394" class="s" text-anchor="start">m=9, u=8, noise=11</text>
<text x="470" y="394" class="sb" text-anchor="start" fill="#6F8090">excluded (noise)</text>
<text x="600" y="34" class="pl" text-anchor="start">c</text>
<text x="622" y="34" class="h" text-anchor="start">Refinement by co-segregation with SNVs</text>
<text x="650" y="86" class="s" text-anchor="middle">SNV</text>
<circle cx="650" cy="110" r="10" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="650" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="650" cy="170" r="10" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="650" y="174" class="s" text-anchor="middle" fill="#fff">a</text>
<text x="730" y="86" class="s" text-anchor="middle">CpG</text>
<circle cx="730" cy="110" r="10" fill="#16233D" stroke="#16233D" stroke-width="1.5"/>
<circle cx="730" cy="170" r="10" fill="#fff" stroke="#16233D" stroke-width="1.5"/>
<text x="810" y="86" class="s" text-anchor="middle">SNV</text>
<circle cx="810" cy="110" r="10" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="810" y="114" class="s" text-anchor="middle" fill="#fff">r</text>
<circle cx="810" cy="170" r="10" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="810" y="174" class="s" text-anchor="middle" fill="#fff">a</text>
<text x="890" y="86" class="s" text-anchor="middle">CpG</text>
<circle cx="890" cy="110" r="10" fill="#16233D" stroke="#16233D" stroke-width="1.5"/>
<circle cx="890" cy="170" r="10" fill="#fff" stroke="#16233D" stroke-width="1.5"/>
<text x="970" y="86" class="s" text-anchor="middle">CpG</text>
<circle cx="970" cy="110" r="10" fill="#16233D" stroke="#16233D" stroke-width="1.5"/>
<circle cx="970" cy="170" r="10" fill="#fff" stroke="#16233D" stroke-width="1.5"/>
<line x1="660" y1="110" x2="720" y2="110" stroke="#2E8B57" stroke-width="4" stroke-linecap="round"/>
<line x1="660" y1="170" x2="720" y2="170" stroke="#2E8B57" stroke-width="4" stroke-linecap="round"/>
<text x="690.0" y="92" class="sb" text-anchor="middle" fill="#2E8B57">strong</text>
<line x1="740" y1="110" x2="800" y2="110" stroke="#2E8B57" stroke-width="4" stroke-linecap="round"/>
<line x1="740" y1="170" x2="800" y2="170" stroke="#2E8B57" stroke-width="4" stroke-linecap="round"/>
<line x1="820" y1="110" x2="880" y2="110" stroke="#CBD5DE" stroke-width="2" stroke-linecap="round"/>
<line x1="820" y1="170" x2="880" y2="170" stroke="#CBD5DE" stroke-width="2" stroke-linecap="round"/>
<text x="850.0" y="92" class="sb" text-anchor="middle" fill="#6F8090">weak</text>
<line x1="900" y1="110" x2="960" y2="110" stroke="#E0A030" stroke-width="3" stroke-linecap="round"/>
<line x1="900" y1="170" x2="960" y2="170" stroke="#E0A030" stroke-width="3" stroke-linecap="round"/>
<text x="930.0" y="92" class="sb" text-anchor="middle" fill="#E0A030">CpG–CpG</text>
<text x="620" y="215" class="s" text-anchor="start">strong anchor: CpG state co-segregates with an SNV within the next</text>
<text x="620" y="231" class="s" text-anchor="start">20 variants on &gt; max(6, (d₁+d₂)/4) reads with majority ratio ≥ 0.9</text>
<text x="620" y="255" class="s" text-anchor="start">weak CpG: no qualifying SNV link; accepted only if it co-segregates</text>
<text x="620" y="271" class="s" text-anchor="start">with an already accepted CpG (iterative expansion, 2 rounds)</text>
<text x="620" y="295" class="s" text-anchor="start">adjacent CpG coordinates are merged and represented by the first</text>
<text x="600" y="340" class="pl" text-anchor="start">d</text>
<text x="622" y="340" class="h" text-anchor="start">Output VCF record</text>
<text x="620" y="372" class="code" text-anchor="start">chr1  10469  .  N  .  .  PASS  RS=P;MR=read3,read7,...;NR=read1,read4,...</text>
<text x="620" y="390" class="code" text-anchor="start">GT:MD:UD:DP  0/1:14:12:28</text>
<text x="620" y="416" class="s" text-anchor="start">RS strand; MR/NR methylated and unmethylated read names (used by phase</text>
<text x="620" y="432" class="s" text-anchor="start">to attach 5mC alleles to reads); MD/UD/DP depths. Phased output adds PS and 0|1.</text>
</svg>