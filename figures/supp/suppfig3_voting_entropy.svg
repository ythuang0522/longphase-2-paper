<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<title>Multi-neighbour voting and phasing entropy</title>

<style>
 text{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;fill:#16233D}
 .pl{font-size:22px;font-weight:700}
 .h{font-size:15px;font-weight:600}
 .t{font-size:13px}
 .tb{font-size:13px;font-weight:600}
 .s{font-size:11px;fill:#6F8090}
 .sb{font-size:11px;font-weight:600}
 .m{font-size:13px;font-style:italic}
 .code{font-family:Menlo,Consolas,"Courier New",monospace;font-size:11.5px}
 .w{fill:#ffffff}
</style>

<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F8090"/></marker><marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16233D"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="20" y="34" class="pl" text-anchor="start">a</text>
<text x="42" y="34" class="h" text-anchor="start">Variant v receives weighted votes from up to k = 35 upstream variants</text>
<text x="80" y="100" class="m" text-anchor="middle">v₋₅</text>
<circle cx="80" cy="130" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="80" y="134" class="sb" text-anchor="middle" fill="#fff">r</text>
<circle cx="80" cy="210" r="11" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="80" y="214" class="sb" text-anchor="middle" fill="#fff">a</text>
<text x="160" y="100" class="m" text-anchor="middle">v₋₄</text>
<circle cx="160" cy="130" r="11" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="160" y="134" class="sb" text-anchor="middle" fill="#fff">r</text>
<circle cx="160" cy="210" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="160" y="214" class="sb" text-anchor="middle" fill="#fff">a</text>
<text x="240" y="100" class="m" text-anchor="middle">v₋₃</text>
<circle cx="240" cy="130" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="240" y="134" class="sb" text-anchor="middle" fill="#fff">r</text>
<circle cx="240" cy="210" r="11" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="240" y="214" class="sb" text-anchor="middle" fill="#fff">a</text>
<text x="320" y="100" class="m" text-anchor="middle">v₋₂</text>
<circle cx="320" cy="130" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="320" y="134" class="sb" text-anchor="middle" fill="#fff">r</text>
<circle cx="320" cy="210" r="11" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="320" y="214" class="sb" text-anchor="middle" fill="#fff">a</text>
<text x="400" y="100" class="m" text-anchor="middle">v₋₁</text>
<circle cx="400" cy="130" r="11" fill="#DC2B23" stroke="#DC2B23" stroke-width="1.5"/>
<text x="400" y="134" class="sb" text-anchor="middle" fill="#fff">r</text>
<circle cx="400" cy="210" r="11" fill="#1687C9" stroke="#1687C9" stroke-width="1.5"/>
<text x="400" y="214" class="sb" text-anchor="middle" fill="#fff">a</text>
<text x="480" y="100" class="m" text-anchor="middle">v</text>
<circle cx="480" cy="130" r="11" fill="#fff" stroke="#6F8090" stroke-width="1.8"/>
<text x="480" y="134" class="sb" text-anchor="middle" fill="#6F8090">r</text>
<circle cx="480" cy="210" r="11" fill="#fff" stroke="#6F8090" stroke-width="1.8"/>
<text x="480" y="214" class="sb" text-anchor="middle" fill="#6F8090">a</text>
<path d="M91,130 C280.0,70 280.0,70 469,130" stroke="#1687C9" stroke-width="4.966657884201758" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<text x="268.0" y="64" class="sb" text-anchor="middle" fill="#1687C9">20</text>
<path d="M171,130 C320.0,70 320.0,70 469,130" stroke="#1687C9" stroke-width="1.9030899869919435" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<text x="314.0" y="69" class="sb" text-anchor="middle" fill="#1687C9">1</text>
<path d="M251,130 C360.0,70 360.0,70 469,130" stroke="#1687C9" stroke-width="1.9030899869919435" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<text x="360.0" y="74" class="sb" text-anchor="middle" fill="#1687C9">1</text>
<path d="M331,210 C400.0,270 400.0,270 469,210" stroke="#DC2B23" stroke-width="1.9030899869919435" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<text x="406.0" y="270" class="sb" text-anchor="middle" fill="#DC2B23">1</text>
<path d="M411,130 C440.0,70 440.0,70 469,130" stroke="#1687C9" stroke-width="1.1241780554746752" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<text x="452.0" y="84" class="sb" text-anchor="middle" fill="#1687C9">0.1</text>
<text x="560" y="134" class="s" text-anchor="start">votes for hap 1</text>
<text x="560" y="214" class="s" text-anchor="start">votes for hap 2</text>
<text x="40" y="290" class="t" text-anchor="start">h₁(v) = 20 + 1 + 1 + 0.1 = 22.1        h₂(v) = 1</text>
<text x="40" y="314" class="s" text-anchor="start">v assigned to haplotype 1;  tie h₁ = h₂ opens a new phase block (PS = position of first variant)</text>
<text x="640" y="34" class="pl" text-anchor="start">b</text>
<text x="662" y="34" class="h" text-anchor="start">Phasing entropy PE</text>
<text x="660" y="76" class="t" text-anchor="start">PE(v) = − Σ pᵢ log₂ pᵢ,   pᵢ = hᵢ / (h₁ + h₂)</text>
<text x="660" y="124" class="sb" text-anchor="start">22.1 : 1</text>
<rect x="720" y="110" width="191.34199134199133" height="18" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="911.3419913419914" y="110" width="8.658008658008658" height="18" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<text x="935" y="124" class="tb" text-anchor="start" fill="#16233D">PE = 0.257</text>
<text x="660" y="170" class="sb" text-anchor="start">3 : 1</text>
<rect x="720" y="156" width="150.0" height="18" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="870.0" y="156" width="50.0" height="18" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<text x="935" y="170" class="tb" text-anchor="start" fill="#E0A030">PE = 0.811</text>
<text x="660" y="216" class="sb" text-anchor="start">4 : 3</text>
<rect x="720" y="202" width="114.28571428571429" height="18" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="834.2857142857143" y="202" width="85.71428571428571" height="18" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<text x="935" y="216" class="tb" text-anchor="start" fill="#E0A030">PE = 0.985</text>
<text x="660" y="262" class="sb" text-anchor="start">5 : 5</text>
<rect x="720" y="248" width="100.0" height="18" rx="2" fill="#1687C9" stroke="none" stroke-width="1" opacity="1"/>
<rect x="820.0" y="248" width="100.0" height="18" rx="2" fill="#DC2B23" stroke="none" stroke-width="1" opacity="1"/>
<text x="935" y="262" class="tb" text-anchor="start" fill="#E0A030">PE = 1.000</text>
<rect x="715" y="150" width="330" height="76" rx="4" fill="none" stroke="#E0A030" stroke-width="1.5" opacity="1" stroke-dasharray="4,3"/>
<text x="720" y="312" class="s" text-anchor="start" fill="#E0A030">PE ≥ 0.80 triggers a GNN window (Supplementary Fig. 6)</text>
<text x="660" y="340" class="s" text-anchor="start">Written to VCF as INFO/PE, INFO/H1, INFO/H2 for every phased variant.</text>
<text x="20" y="380" class="pl" text-anchor="start">c</text>
<text x="42" y="380" class="h" text-anchor="start">Block formation</text>
<text x="40" y="412" class="s" text-anchor="start">Variants are visited in coordinate order. Each assigned variant casts votes to its next k neighbours</text>
<text x="40" y="428" class="s" text-anchor="start">within 300 kb; a variant that receives no informative vote, or a tie, starts a new block. Blocks with a</text>
<text x="40" y="444" class="s" text-anchor="start">single variant are dropped. Haplotype labels are propagated along the block to produce phased GTs (0|1 / 1|0).</text>
</svg>