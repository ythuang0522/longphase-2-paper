<text x="172.0" y="339.0" class="s" text-anchor="start" fill="#1687C9">hap 1</text>
<text x="212.0" y="339.0" class="sb" text-anchor="start" fill="#1F7A4D">consistent</text>
<text x="56.0" y="359.0" class="s" text-anchor="end">read 2</text>
