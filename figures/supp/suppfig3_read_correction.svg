<text x="212.0" y="359.0" class="sb" text-anchor="start" fill="#1F7A4D">consistent</text>
<text x="56.0" y="379.0" class="s" text-anchor="end">read 3</text>
<line x1="62.0" y1="376.0" x2="166.0" y2="376.0" stroke="#6CC8EE" stroke-width="5" stroke-linecap="round"/>
<circle cx="114.0" cy="376.0" r="7" fill="#fff" stroke="#DC2B23" stroke-width="1.8"/>
<text x="114.0" y="379.0" class="n" text-anchor="middle" fill="#DC2B23">a</text>
<text x="172.0" y="379.0" class="s" text-anchor="start" fill="#1687C9">hap 1</text>
<text x="212.0" y="379.0" class="sb" text-anchor="start" fill="#DC2B23">conflicting</text>
<text x="278.0" y="339.0" class="s" text-anchor="start">n<tspan font-size="72%" baseline-shift="sub">1</tspan> = 2,  n<tspan font-size="72%" baseline-shift="sub">2</tspan> = 1</text>
<text x="278.0" y="360.0" class="s" text-anchor="start">ρ = max / sum</text>
